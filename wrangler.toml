name = "rispostaflirt"
main = "worker.js"
compatibility_date = "2026-10-31"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"
exclude = ["worker.js", "reply.js", "auth.js", "wrangler.toml", "README_CLOUDFLARE_WORKER.txt"]

# Inserisci il database_id reale del tuo database D1 prima del deploy.
[[d1_databases]]
binding = "DB"
database_name = "rispostaflirt-auth"
database_id = "INCOLLA_QUI_IL_DATABASE_ID"
